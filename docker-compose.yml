services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: setflow
      POSTGRES_USER: setflow
      POSTGRES_PASSWORD: setflow
    volumes:
      - setflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U setflow -d setflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://setflow:setflow@db:5432/setflow
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  setflow-postgres:
