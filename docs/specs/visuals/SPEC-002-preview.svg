<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600">
  <style>
    .title { font: 28px sans-serif; fill: #111 }
    .section { font: 16px sans-serif; fill: #222 }
    .box { fill: #f8f9fb; stroke: #e6e9ef; }
    .header { fill: #3b82f6; font: bold 20px sans-serif; fill: white }
  </style>
  <rect width="1200" height="1600" fill="#ffffff"/>
  <rect x="40" y="30" width="1120" height="80" class="box" fill="#1f2937"/>
  <text x="60" y="80" class="header">SPEC-002 — Criação de Banda, Membros e Contexto Ativo</text>

  <rect x="60" y="120" width="1080" height="120" rx="8" class="box"/>
  <text x="80" y="150" class="section">Objetivo: Criar e gerenciar bandas; associar membros; alternar contexto ativo.</text>

  <rect x="60" y="260" width="520" height="220" rx="8" class="box"/>
  <text x="80" y="290" class="section">RF (ex):</text>
  <text x="100" y="320" class="section">- RF-01: CRUD de bandas</text>
  <text x="100" y="350" class="section">- RF-02: Associar usuários</text>
  <text x="100" y="380" class="section">- RF-03: Convites por email</text>

  <rect x="620" y="260" width="520" height="220" rx="8" class="box"/>
  <text x="640" y="290" class="section">RB / RNF (ex):</text>
  <text x="660" y="320" class="section">- RB-01: primeiro criador = líder</text>
  <text x="660" y="350" class="section">- RNF-02: entrega de email confiável</text>

  <rect x="60" y="500" width="1080" height="320" rx="8" class="box"/>
  <text x="80" y="540" class="section">Fluxos:</text>
  <text x="100" y="570" class="section">1) Criar Banda -> líder automático</text>
  <text x="100" y="600" class="section">2) Convidar Membro -> aceitar -> associação</text>
  <text x="100" y="630" class="section">3) Alternar Contexto -> salvar na sessão</text>

  <rect x="60" y="840" width="1080" height="200" rx="8" class="box"/>
  <text x="80" y="880" class="section">Questões em Aberto:</text>
  <text x="100" y="910" class="section">- OPEN-021: campos obrigatórios da banda</text>
  <text x="100" y="940" class="section">- OPEN-022: transferência de liderança</text>

</svg>
