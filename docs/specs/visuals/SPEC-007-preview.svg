<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600">
  <style>.h{font:22px sans-serif;fill:#fff}.t{font:16px sans-serif;fill:#111}.box{fill:#fff7f0;stroke:#fee2e2}</style>
  <rect width="1200" height="1600" fill="#fff"/>
  <rect x="40" y="30" width="1120" height="80" fill="#9a3412"/>
  <text x="60" y="80" class="h">SPEC-007 — Visualização de Setlists Confirmados e Domínio Individual</text>
  <rect x="60" y="120" width="1080" height="140" class="box"/>
  <text x="80" y="150" class="t">Objetivo: Permitir preparação individual e registro privado de domínio por música.</text>
  <rect x="60" y="280" width="520" height="220" class="box"/>
  <text x="80" y="310" class="t">RF ex: exibir confirmados, registrar domínio.</text>
  <rect x="620" y="280" width="520" height="220" class="box"/>
  <text x="640" y="310" class="t">RNF: privacidade e segregação por banda.</text>
  <rect x="60" y="520" width="1080" height="320" class="box"/>
