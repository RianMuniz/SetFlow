<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600">
  <style>.h{font:22px sans-serif;fill:#fff}.t{font:16px sans-serif;fill:#111}.box{fill:#f8fafc;stroke:#e6f0ff}</style>
  <rect width="1200" height="1600" fill="#fff"/>
  <rect x="40" y="30" width="1120" height="80" fill="#0ea5e9"/>
  <text x="60" y="80" class="h">SPEC-008 — Ciclo de Vida Final e Histórico de Setlists</text>
  <rect x="60" y="120" width="1080" height="140" class="box"/>
  <text x="80" y="150" class="t">Objetivo: Marcar setlists como Tocado e manter histórico consultável.</text>
  <rect x="60" y="280" width="520" height="220" class="box"/>
